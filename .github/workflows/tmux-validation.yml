name: tmux-validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-contract:
    name: repository-contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Reject active provider-specific references
        shell: bash
        run: |
          set -euo pipefail
          if rg -n -i --hidden --glob '!.git/**' --glob '!.github/workflows/tmux-validation.yml' '(claude|anthropic)' .; then
            echo 'Active provider-specific references found.' >&2
            exit 1
          fi

      - name: Check tracked symlinks
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r entry; do
            path=${entry#*$'\t'}
            if [[ ! -e "$path" ]]; then
              echo "Broken tracked symlink: $path" >&2
              exit 1
            fi
          done < <(git ls-files -s | awk '$1 == 120000')

      - name: Check required workspace guidance
        shell: bash
        run: |
          set -euo pipefail
          test -s AGENTS.md
          test -L GEMINI.md
          test "$(readlink GEMINI.md)" = AGENTS.md
          rg -q 'tmux' README.md
          rg -q 'Hermes harness' README.md
          rg -q 'Pi harness' README.md
          rg -q 'OpenAI Codex CLI' README.md
          rg -q 'Google Antigravity' README.md
